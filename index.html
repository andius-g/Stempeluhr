<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F3EC" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Stempeluhr" />
  <title>Stempeluhr</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="manifest" href="./manifest.json" />
  <style>
    /* ==========================================================================
       DESIGN-PAKETE (CREMIG & ONE-LINE-ART ALS STANDARD)
       ========================================================================== */
    :root,
    body[data-theme="creamy"] {
      --bg-canvas: #F7F3EC;
      --bg-surface: #FFFDF9;
      --bg-surface-soft: #EFE9DF;
      --border-subtle: #E5DDD0;

      --text-primary: #2E2924;
      --text-secondary: #7A7065;
      --text-on-accent: #FFFDF9;

      --accent-in: #6F8F72;
      --accent-in-soft: #EAF1EA;
      --accent-out: #C97A5B;
      --accent-out-soft: #F8EBE5;
      --accent-pause: #C89B54;
      --accent-pause-soft: #F9F2E4;

      --line-art-stroke: rgba(122, 112, 101, 0.26);
      --shadow-soft: 0 8px 24px rgba(46, 41, 36, 0.05);
      --shadow-inset: none;
      --blur-surface: none;

      --radius-card: 24px;
      --radius-btn: 20px;
      --touch-main: 60px;
      --touch-std: 52px;
    }

    body[data-theme="glass"] {
      --bg-canvas: linear-gradient(145deg, #EAE6DF 0%, #DCE4E2 50%, #E9DFD8 100%);
      --bg-surface: rgba(255, 253, 249, 0.64);
      --bg-surface-soft: rgba(255, 255, 255, 0.44);
      --border-subtle: rgba(255, 255, 255, 0.72);

      --text-primary: #24272B;
      --text-secondary: #5C636A;
      --text-on-accent: #FFFFFF;

      --accent-in: #5B8C7A;
      --accent-in-soft: rgba(91, 140, 122, 0.16);
      --accent-out: #C7745E;
      --accent-out-soft: rgba(199, 116, 94, 0.16);
      --accent-pause: #C6954B;
      --accent-pause-soft: rgba(198, 149, 75, 0.16);

      --line-art-stroke: rgba(36, 39, 43, 0.18);
      --shadow-soft: 0 10px 30px rgba(31, 38, 135, 0.08);
      --shadow-inset: none;
      --blur-surface: blur(14px);
    }

    body[data-theme="neumorph"] {
      --bg-canvas: #ECE8E1;
      --bg-surface: #ECE8E1;
      --bg-surface-soft: #E4DFD7;
      --border-subtle: transparent;

      --text-primary: #332E29;
      --text-secondary: #756D64;
      --text-on-accent: #FFFDF9;

      --accent-in: #6C8E70;
      --accent-in-soft: #E2EAE3;
      --accent-out: #C6785A;
      --accent-out-soft: #EFE2DC;
      --accent-pause: #C29652;
      --accent-pause-soft: #EFE7D8;

      --line-art-stroke: rgba(117, 109, 100, 0.22);
      --shadow-soft: 7px 7px 16px #D5D0C8, -7px -7px 16px #FFFFFF;
      --shadow-inset: inset 4px 4px 8px #D5D0C8, inset -4px -4px 8px #FFFFFF;
      --blur-surface: none;
    }

    body[data-theme="oled"] {
      --bg-canvas: #0D0D0D;
      --bg-surface: #171717;
      --bg-surface-soft: #222222;
      --border-subtle: #2C2C2C;

      --text-primary: #F2EFE9;
      --text-secondary: #9E988E;
      --text-on-accent: #121212;

      --accent-in: #84A98C;
      --accent-in-soft: rgba(132, 169, 140, 0.16);
      --accent-out: #E08E6D;
      --accent-out-soft: rgba(224, 142, 109, 0.16);
      --accent-pause: #DFB168;
      --accent-pause-soft: rgba(223, 177, 104, 0.16);

      --line-art-stroke: rgba(242, 239, 233, 0.14);
      --shadow-soft: none;
      --shadow-inset: none;
      --blur-surface: none;
    }

    /* ==========================================================================
       GRUNDLAYOUT & SMARTPHONE-TOUCH-ERGONOMIE
       ========================================================================== */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      line-height: 1.45;
      overscroll-behavior: none;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .su-app-shell {
      position: relative;
      max-width: 560px;
      margin: 0 auto;
      min-height: 100dvh;
      padding-bottom: calc(92px + env(safe-area-inset-bottom));
      background: var(--bg-canvas);
    }

    /* Deckende Ansichten -> kein Durchblitzen beim Wechseln/Wischen */
    .su-view {
      display: none;
      width: 100%;
      padding: calc(16px + env(safe-area-inset-top)) 16px 24px;
      background: var(--bg-canvas);
    }

    .su-view.is-active {
      display: block;
      animation: suViewFadeIn 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes suViewFadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .su-card {
      position: relative;
      overflow: hidden;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: 20px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: var(--blur-surface);
      -webkit-backdrop-filter: var(--blur-surface);
    }

    .su-stack {
      display: grid;
      gap: 14px;
    }

    .su-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: var(--touch-std);
      padding: 13px 18px;
      border-radius: var(--radius-btn);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      box-shadow: var(--shadow-soft);
      transition: transform 0.12s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .su-btn:active {
      transform: scale(0.975);
      box-shadow: var(--shadow-inset);
    }

    .su-btn-primary-in,
    .su-btn-primary-out {
      width: 100%;
      min-height: var(--touch-main);
      font-size: 1.08rem;
      font-weight: 700;
      border: none;
      color: var(--text-on-accent);
    }

    .su-btn-primary-in {
      background: var(--accent-in);
    }

    .su-btn-primary-out {
      background: var(--accent-out);
    }

    .su-btn-soft-pause {
      background: var(--accent-pause-soft);
      border-color: transparent;
    }

    .su-btn.is-active {
      border-color: var(--accent-in);
      background: var(--accent-in-soft);
    }

    /* One-Line-Art */
    .one-line-art {
      pointer-events: none;
      user-select: none;
      stroke: var(--line-art-stroke);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .one-line-bg-corner {
      position: absolute;
      right: -6px;
      bottom: -8px;
      width: 155px;
      height: 112px;
    }

    /* Layout-Modus (Kompakt vs. Detail) */
    .layout-mode-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    body[data-home-layout="compact"] .home-detail-only {
      display: none;
    }

    body[data-home-layout="detail"] .home-detail-only {
      display: block;
    }

    /* Heutige Stempel-Einträge */
    .entry-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 50px;
      padding: 10px 14px;
      border-radius: 16px;
      background: var(--bg-surface-soft);
      border: 1px solid var(--border-subtle);
      margin-top: 8px;
    }

    .entry-del-btn {
      min-width: 44px;
      min-height: 44px;
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Wochenkalender */
    .week-toolbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .week-label-box {
      text-align: center;
      margin-bottom: 14px;
    }

    .week-label-main {
      font-weight: 700;
      font-size: 1.08rem;
    }

    .week-label-sub {
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    .week-day-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 56px;
      padding: 12px 16px;
      margin-bottom: 10px;
      border-radius: 18px;
      background: var(--bg-surface-soft);
      border: 1px solid var(--border-subtle);
    }

    .week-day-row.is-today {
      border-color: var(--accent-in);
      background: var(--accent-in-soft);
    }

    /* Design-Paket-Auswahl */
    .theme-picker-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .theme-option-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      min-height: 76px;
      padding: 14px;
      border-radius: 18px;
      border: 2px solid var(--border-subtle);
      background: var(--bg-surface-soft);
      color: var(--text-primary);
      font-size: 0.92rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }

    .theme-option-btn.is-active {
      border-color: var(--accent-in);
      background: var(--accent-in-soft);
    }

    .theme-swatch-row {
      display: flex;
      gap: 6px;
    }

    .theme-swatch {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.14);
    }

    /* 3-Punkt-Colorwheel */
    .colorwheel-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .colorwheel-stage {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #e57373,
        #f0b66d,
        #e6dc73,
        #81c784,
        #64b5f6,
        #9575cd,
        #f06292,
        #e57373
      );
      border: 2px solid var(--border-subtle);
      box-shadow: var(--shadow-soft);
      touch-action: none;
    }

    .colorwheel-dot {
      position: absolute;
      width: 30px;
      height: 30px;
      margin-left: -15px;
      margin-top: -15px;
      border-radius: 50%;
      border: 3px solid #FFFDF9;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #FFFFFF;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
    }

    .colorwheel-dot.is-selected {
      transform: scale(1.16);
      outline: 2px solid var(--text-primary);
      outline-offset: 2px;
    }

    .colorwheel-legend {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
    }

    .color-slot-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-height: 54px;
      padding: 8px;
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface-soft);
      color: var(--text-primary);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .color-slot-btn.is-selected {
      border-color: var(--accent-in);
      background: var(--accent-in-soft);
    }

    /* Scribbles */
    .scribble-canvas {
      width: 100%;
      height: 280px;
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface-soft);
      touch-action: none;
      display: block;
    }

    .scribble-actions {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      margin-top: 12px;
    }

    /* Bottom-Navigation */
    .su-bottom-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 560px;
      bottom: 0;
      z-index: 40;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      backdrop-filter: var(--blur-surface);
      -webkit-backdrop-filter: var(--blur-surface);
    }

    .su-nav-tab {
      min-height: 52px;
      border: none;
      border-radius: 16px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.96rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .su-nav-tab.is-active {
      background: var(--accent-in-soft);
      color: var(--text-primary);
    }
  </style>
</head>
<body data-theme="creamy" data-home-layout="compact">
  <div class="su-app-shell" id="su-app-shell">

    <!-- ANSICHT 1: HEUTE / STEMPELUHR -->
    <section class="su-view is-active" data-view="home">
      <div class="su-stack">
        <div class="layout-mode-bar" role="group" aria-label="Startschirm-Layout">
          <button type="button" class="su-btn is-active" data-layout-choice="compact">Kompakt</button>
          <button type="button" class="su-btn" data-layout-choice="detail">Detail</button>
        </div>

        <div class="su-card">
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px;">
            <div>
              <h1 style="margin: 0 0 4px 0; font-size: 1.5rem;">Stempeluhr</h1>
              <p id="home-status-text" style="margin: 0; color: var(--text-secondary); font-size: 0.95rem;">
                Bereit zum Stempeln
              </p>
            </div>
            <strong id="home-live-clock" style="font-size: 1.3rem; font-variant-numeric: tabular-nums;">--:--</strong>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px;">
            <button type="button" class="su-btn su-btn-primary-in" id="btn-stamp-in">Kommen</button>
            <button type="button" class="su-btn su-btn-primary-out" id="btn-stamp-out">Gehen</button>
          </div>

          <svg class="one-line-art one-line-bg-corner" viewBox="0 0 160 110" aria-hidden="true">
            <path d="M 8 88 C 34 88, 42 52, 68 52 C 92 52, 96 76, 118 76 C 134 76, 142 36, 114 26 C 92 18, 76 44, 96 64 C 114 82, 140 74, 156 66" />
          </svg>
        </div>

        <div class="su-card">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <strong>Heute erfasst</strong>
            <span id="today-total-badge" style="font-weight: 700; color: var(--accent-in);">0:00 Std</span>
          </div>
          <div id="today-entries-list"></div>
        </div>

        <div class="su-card home-detail-only">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <strong>Schnellaktionen &amp; Pause</strong>
            <span id="today-pause-badge" style="color: var(--text-secondary); font-size: 0.9rem;">Pause: 0 Min</span>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button type="button" class="su-btn su-btn-soft-pause" id="btn-quick-pause">Pause +15 Min</button>
            <button type="button" class="su-btn" id="btn-quick-undo">Letzte rückgängig</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ANSICHT 2: WOCHENKALENDER -->
    <section class="su-view" data-view="week">
      <div class="su-card">
        <div class="week-toolbar">
          <button type="button" class="su-btn" id="btn-prev-week">← Vorherige</button>
          <button type="button" class="su-btn" id="btn-today-week">Heute</button>
          <button type="button" class="su-btn" id="btn-next-week">Nächste →</button>
        </div>

        <div class="week-label-box">
          <div class="week-label-main" id="week-title">Aktuelle Woche</div>
          <div class="week-label-sub" id="week-range">Zeitraum…</div>
        </div>

        <div id="week-days-list"></div>
      </div>
    </section>

    <!-- ANSICHT 3: MENÜ (SCRIBBLES, DESIGN-PAKETE & 3-PUNKT-COLORWHEEL) -->
    <section class="su-view" data-view="menu">
      <div class="su-stack">
        <div class="su-card">
          <h2 style="margin: 0 0 10px 0; font-size: 1.2rem;">Menü</h2>
          <div style="display: grid; gap: 10px;">
            <button type="button" class="su-btn" id="btn-open-scribbles">
              Scribbles — Kritzel &amp; Notizen
            </button>
            <button type="button" class="su-btn" id="btn-open-themes">
              Design-Pakete &amp; Farbrad
            </button>
          </div>
        </div>

        <!-- Scribbles -->
        <div class="su-card" id="scribbles-panel">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="margin: 0; font-size: 1.08rem;">Scribbles</h3>
            <span style="font-size: 0.85rem; color: var(--text-secondary);">Wird lokal gespeichert</span>
          </div>

          <canvas id="scribble-canvas" class="scribble-canvas" width="600" height="360"></canvas>

          <div class="scribble-actions">
            <button type="button" class="su-btn is-active" id="btn-scribble-pen">Stift</button>
            <button type="button" class="su-btn" id="btn-scribble-eraser">Radierer</button>
            <button type="button" class="su-btn" id="btn-scribble-clear">Leeren</button>
          </div>
        </div>

        <!-- Wählbare Design-Pakete -->
        <div class="su-card" id="themes-panel">
          <h3 style="margin: 0 0 4px 0; font-size: 1.08rem;">Design-Pakete</h3>
          <p style="margin: 0; color: var(--text-secondary); font-size: 0.9rem;">
            Oberfläche frei wählbar
          </p>

          <div class="theme-picker-grid">
            <button type="button" class="theme-option-btn" data-theme-choice="creamy">
              <span class="theme-swatch-row">
                <span class="theme-swatch" style="background:#F7F3EC;"></span>
                <span class="theme-swatch" style="background:#6F8F72;"></span>
                <span class="theme-swatch" style="background:#C97A5B;"></span>
              </span>
              <span>Cremig &amp; Line-Art</span>
            </button>

            <button type="button" class="theme-option-btn" data-theme-choice="glass">
              <span class="theme-swatch-row">
                <span class="theme-swatch" style="background:#DCE4E2;"></span>
                <span class="theme-swatch" style="background:#5B8C7A;"></span>
                <span class="theme-swatch" style="background:#C7745E;"></span>
              </span>
              <span>Glassmorphism</span>
            </button>

            <button type="button" class="theme-option-btn" data-theme-choice="neumorph">
              <span class="theme-swatch-row">
                <span class="theme-swatch" style="background:#ECE8E1;"></span>
                <span class="theme-swatch" style="background:#6C8E70;"></span>
                <span class="theme-swatch" style="background:#C6785A;"></span>
              </span>
              <span>Neumorphism</span>
            </button>

            <button type="button" class="theme-option-btn" data-theme-choice="oled">
              <span class="theme-swatch-row">
                <span class="theme-swatch" style="background:#0D0D0D;"></span>
                <span class="theme-swatch" style="background:#84A98C;"></span>
                <span class="theme-swatch" style="background:#E08E6D;"></span>
              </span>
              <span>Nacht / OLED</span>
            </button>
          </div>
        </div>

        <!-- 3-Punkt-Colorwheel -->
        <div class="su-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
            <h3 style="margin: 0; font-size: 1.08rem;">Farbrad (3 Punkte = 3 Farben)</h3>
            <button type="button" class="su-btn" id="btn-reset-wheel" style="min-height: 40px; padding: 6px 12px; font-size: 0.85rem;">
              Reset
            </button>
          </div>
          <p style="margin: 0 0 12px 0; font-size: 0.88rem; color: var(--text-secondary);">
            Jeder Punkt im Rad steuert genau eine der drei Farben.
          </p>

          <div class="colorwheel-wrap">
            <div class="colorwheel-stage" id="colorwheel-stage">
              <div class="colorwheel-dot is-selected" data-color-slot="bg" title="Hintergrund">1</div>
              <div class="colorwheel-dot" data-color-slot="surface" title="Karte">2</div>
              <div class="colorwheel-dot" data-color-slot="accent" title="Akzent">3</div>
            </div>

            <div class="colorwheel-legend">
              <button type="button" class="color-slot-btn is-selected" data-select-slot="bg">
                <span>1 · Grund</span>
                <small id="slot-hex-bg">#F7F3EC</small>
              </button>
              <button type="button" class="color-slot-btn" data-select-slot="surface">
                <span>2 · Karte</span>
                <small id="slot-hex-surface">#FFFDF9</small>
              </button>
              <button type="button" class="color-slot-btn" data-select-slot="accent">
                <span>3 · Akzent</span>
                <small id="slot-hex-accent">#6F8F72</small>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- BOTTOM-NAVIGATION -->
    <nav class="su-bottom-nav" aria-label="Hauptnavigation">
      <button type="button" class="su-nav-tab is-active" data-nav-target="home">Heute</button>
      <button type="button" class="su-nav-tab" data-nav-target="week">Woche</button>
      <button type="button" class="su-nav-tab" data-nav-target="menu">Menü</button>
    </nav>
  </div>

  <script>
    /* ==========================================================================
       DATEN & STEMPEL-LOGIK
       ========================================================================== */
    const STORAGE_KEY = "stempeluhr_data_v2";
    const THEME_STORAGE_KEY = "stempeluhr_design_package_v2";
    const LAYOUT_STORAGE_KEY = "stempeluhr_home_layout_v2";
    const SCRIBBLE_STORAGE_KEY = "stempeluhr_scribble_v2";

    function loadAppData() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { days: {} };
      } catch {
        return { days: {} };
      }
    }

    function saveAppData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function dateKey(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function ensureDay(data, key) {
      if (!data.days[key]) {
        data.days[key] = { stamps: [], pauseMinutes: 0 };
      }
      return data.days[key];
    }

    function formatMinutes(totalMin) {
      const safe = Math.max(0, Math.round(totalMin));
      const h = Math.floor(safe / 60);
      const m = String(safe % 60).padStart(2, "0");
      return `${h}:${m} Std`;
    }

    function calcWorkMinutes(dayObj, nowMs = Date.now()) {
      let totalMs = 0;
      let openIn = null;

      dayObj.stamps.forEach((s) => {
        if (s.type === "in") {
          openIn = s.ts;
        } else if (s.type === "out" && openIn !== null) {
          totalMs += Math.max(0, s.ts - openIn);
          openIn = null;
        }
      });

      if (openIn !== null) {
        totalMs += Math.max(0, nowMs - openIn);
      }

      const rawMinutes = totalMs / 60000;
      return Math.max(0, rawMinutes - (dayObj.pauseMinutes || 0));
    }

    function stampNow(type) {
      const data = loadAppData();
      const day = ensureDay(data, dateKey());
      day.stamps.push({ type, ts: Date.now() });
      saveAppData(data);
      renderToday();
      renderWeekCalendar();
    }

    function renderToday() {
      const data = loadAppData();
      const day = ensureDay(data, dateKey());
      const listEl = document.getElementById("today-entries-list");
      const statusEl = document.getElementById("home-status-text");
      const totalEl = document.getElementById("today-total-badge");
      const pauseEl = document.getElementById("today-pause-badge");
      if (!listEl) return;

      const last = day.stamps[day.stamps.length - 1];
      if (!last) {
        statusEl.textContent = "Noch nicht gestempelt";
      } else if (last.type === "in") {
        const t = new Date(last.ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
        statusEl.textContent = `Eingestempelt seit ${t} Uhr`;
      } else {
        const t = new Date(last.ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
        statusEl.textContent = `Ausgestempelt um ${t} Uhr`;
      }

      totalEl.textContent = formatMinutes(calcWorkMinutes(day));
      if (pauseEl) pauseEl.textContent = `Pause: ${day.pauseMinutes || 0} Min`;

      listEl.innerHTML = "";
      if (day.stamps.length === 0) {
        listEl.innerHTML = `<p style="margin: 12px 0 0; color: var(--text-secondary); font-size: 0.92rem;">Heute noch keine Zeiten erfasst.</p>`;
        return;
      }

      day.stamps.forEach((entry, index) => {
        const timeStr = new Date(entry.ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
        const row = document.createElement("div");
        row.className = "entry-row";
        row.innerHTML = `
          <div>
            <strong>${entry.type === "in" ? "Kommen" : "Gehen"}</strong>
            <span style="margin-left: 10px; color: var(--text-secondary);">${timeStr} Uhr</span>
          </div>
          <button type="button" class="entry-del-btn" data-del-idx="${index}" aria-label="Eintrag löschen">×</button>
        `;
        listEl.appendChild(row);
      });

      listEl.querySelectorAll("[data-del-idx]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = parseInt(btn.getAttribute("data-del-idx"), 10);
          const fresh = loadAppData();
          const todayObj = ensureDay(fresh, dateKey());
          todayObj.stamps.splice(idx, 1);
          saveAppData(fresh);
          renderToday();
          renderWeekCalendar();
        });
      });
    }

    /* ==========================================================================
       SCHRITT 1: DESIGN-PAKETE
       ========================================================================== */
    const VALID_THEMES = ["creamy", "glass", "neumorph", "oled"];

    function resetCustomWheelOverrides() {
      document.body.style.removeProperty("--bg-canvas");
      document.body.style.removeProperty("--bg-surface");
      document.body.style.removeProperty("--accent-in");
    }

    function applyDesignPackage(themeName) {
      const chosen = VALID_THEMES.includes(themeName) ? themeName : "creamy";
      resetCustomWheelOverrides();
      document.body.setAttribute("data-theme", chosen);
      localStorage.setItem(THEME_STORAGE_KEY, chosen);

      document.querySelectorAll("[data-theme-choice]").forEach((btn) => {
        btn.classList.toggle("is-active", btn.getAttribute("data-theme-choice") === chosen);
      });

      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) {
        const barColors = {
          creamy: "#F7F3EC",
          glass: "#EAE6DF",
          neumorph: "#ECE8E1",
          oled: "#0D0D0D"
        };
        metaTheme.setAttribute("content", barColors[chosen]);
      }
    }

    function initDesignPackages() {
      const saved = localStorage.getItem(THEME_STORAGE_KEY) || "creamy";
      applyDesignPackage(saved);

      document.querySelectorAll("[data-theme-choice]").forEach((btn) => {
        btn.addEventListener("click", () => {
          applyDesignPackage(btn.getAttribute("data-theme-choice"));
        });
      });
    }

    /* ==========================================================================
       SCHRITT 2: DECKENDE NAVIGATION & SAUBERES HORIZONTALES WISCHEN
       ========================================================================== */
    const VIEW_ORDER = ["home", "week", "menu"];
    let activeView = "home";

    function switchView(targetView) {
      if (!VIEW_ORDER.includes(targetView) || targetView === activeView) return;
      activeView = targetView;

      document.querySelectorAll(".su-view").forEach((section) => {
        section.classList.toggle("is-active", section.getAttribute("data-view") === targetView);
      });

      document.querySelectorAll("[data-nav-target]").forEach((tab) => {
        tab.classList.toggle("is-active", tab.getAttribute("data-nav-target") === targetView);
      });

      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function initCleanNavigation() {
      document.querySelectorAll("[data-nav-target]").forEach((tab) => {
        tab.addEventListener("click", () => {
          switchView(tab.getAttribute("data-nav-target"));
        });
      });

      const shell = document.getElementById("su-app-shell");
      if (!shell) return;

      let startX = 0;
      let startY = 0;
      let isTracking = false;

      shell.addEventListener("touchstart", (e) => {
        if (e.touches.length !== 1) return;
        if (e.target.closest("input, textarea, canvas, #colorwheel-stage, [data-no-swipe]")) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        isTracking = true;
      }, { passive: true });

      shell.addEventListener("touchend", (e) => {
        if (!isTracking || e.changedTouches.length !== 1) return;
        isTracking = false;

        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;

        if (Math.abs(dx) < 68 || Math.abs(dx) < Math.abs(dy) * 1.6) return;

        const idx = VIEW_ORDER.indexOf(activeView);
        if (dx < 0 && idx < VIEW_ORDER.length - 1) {
          switchView(VIEW_ORDER[idx + 1]);
        } else if (dx > 0 && idx > 0) {
          switchView(VIEW_ORDER[idx - 1]);
        }
      }, { passive: true });
    }

    /* ==========================================================================
       SCHRITT 3: WOCHENKALENDER, 3-PUNKT-COLORWHEEL & SCRIBBLES
       ========================================================================== */
    let weekOffset = 0;

    function getMondayOfWeek(baseDate, offsetWeeks = 0) {
      const d = new Date(baseDate);
      d.setHours(0, 0, 0, 0);
      const day = d.getDay();
      const diffToMonday = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diffToMonday + offsetWeeks * 7);
      return d;
    }

    function getIsoWeekNumber(date) {
      const target = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = target.getUTCDay() || 7;
      target.setUTCDate(target.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(target.getUTCFullYear(), 0, 1));
      return Math.ceil((((target - yearStart) / 86400000) + 1) / 7);
    }

    function renderWeekCalendar() {
      const titleEl = document.getElementById("week-title");
      const rangeEl = document.getElementById("week-range");
      const listEl = document.getElementById("week-days-list");
      if (!titleEl || !rangeEl || !listEl) return;

      const data = loadAppData();
      const todayStr = dateKey(new Date());
      const monday = getMondayOfWeek(new Date(), weekOffset);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);

      const kw = getIsoWeekNumber(monday);
      titleEl.textContent = weekOffset === 0 ? `Aktuelle Woche · KW ${kw}` : `Kalenderwoche ${kw}`;
      rangeEl.textContent = `${monday.toLocaleDateString("de-DE")} – ${sunday.toLocaleDateString("de-DE")}`;

      const dayNames = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
      listEl.innerHTML = "";

      for (let i = 0; i < 7; i++) {
        const dayDate = new Date(monday);
        dayDate.setDate(monday.getDate() + i);
        const key = dateKey(dayDate);
        const dayObj = data.days[key];
        const mins = dayObj ? calcWorkMinutes(dayObj) : 0;

        const row = document.createElement("div");
        row.className = "week-day-row" + (key === todayStr ? " is-today" : "");
        row.innerHTML = `
          <div>
            <strong>${dayNames[i]}</strong>
            <span style="color: var(--text-secondary); margin-left: 8px;">
              ${dayDate.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })}
            </span>
          </div>
          <span style="font-weight: 600; color: ${mins > 0 ? "var(--text-primary)" : "var(--text-secondary)"};">
            ${mins > 0 ? formatMinutes(mins) : (i >= 5 ? "Frei" : "–")}
          </span>
        `;
        listEl.appendChild(row);
      }
    }

    function initWeekCalendar() {
      document.getElementById("btn-prev-week")?.addEventListener("click", () => {
        weekOffset -= 1;
        renderWeekCalendar();
      });
      document.getElementById("btn-next-week")?.addEventListener("click", () => {
        weekOffset += 1;
        renderWeekCalendar();
      });
      document.getElementById("btn-today-week")?.addEventListener("click", () => {
        weekOffset = 0;
        renderWeekCalendar();
      });
      renderWeekCalendar();
    }

    /* 3-Punkt-Colorwheel */
    const wheelSlots = {
      bg: { angle: 38, varName: "--bg-canvas", hexId: "slot-hex-bg" },
      surface: { angle: 44, varName: "--bg-surface", hexId: "slot-hex-surface" },
      accent: { angle: 126, varName: "--accent-in", hexId: "slot-hex-accent" }
    };
    let selectedWheelSlot = "bg";

    function hslAngleToHex(angleDeg, lightness = 55) {
      const h = ((angleDeg % 360) + 360) % 360;
      const s = 46;
      const l = lightness;
      const a = (s / 100) * Math.min(l / 100, 1 - l / 100);
      const f = (n) => {
        const k = (n + h / 30) % 12;
        const color = l / 100 - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, "0");
      };
      return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
    }

    function renderThreePointWheel(applyToDom = false) {
      const stage = document.getElementById("colorwheel-stage");
      if (!stage) return;

      const size = stage.clientWidth || 220;
      const radiusPx = size / 2 - 22;
      const center = size / 2;

      Object.entries(wheelSlots).forEach(([key, cfg]) => {
        const rad = (cfg.angle * Math.PI) / 180;
        const x = center + Math.cos(rad) * radiusPx;
        const y = center + Math.sin(rad) * radiusPx;

        const hex = key === "bg"
          ? hslAngleToHex(cfg.angle, 94)
          : key === "surface"
          ? hslAngleToHex(cfg.angle, 98)
          : hslAngleToHex(cfg.angle, 48);

        if (applyToDom) {
          document.body.style.setProperty(cfg.varName, hex);
        }

        const dot = stage.querySelector(`[data-color-slot="${key}"]`);
        if (dot) {
          dot.style.left = `${x}px`;
          dot.style.top = `${y}px`;
          dot.style.background = hslAngleToHex(cfg.angle, 52);
          dot.classList.toggle("is-selected", key === selectedWheelSlot);
        }

        const legendBtn = document.querySelector(`[data-select-slot="${key}"]`);
        if (legendBtn) {
          legendBtn.classList.toggle("is-selected", key === selectedWheelSlot);
        }

        const hexLabel = document.getElementById(cfg.hexId);
        if (hexLabel) {
          hexLabel.textContent = hex;
        }
      });
    }

    function initThreePointWheel() {
      const stage = document.getElementById("colorwheel-stage");
      if (!stage) return;

      let draggingSlot = null;

      const updateAngleFromPointer = (clientX, clientY, slotKey) => {
        const rect = stage.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const deg = (Math.atan2(clientY - cy, clientX - cx) * 180) / Math.PI;
        wheelSlots[slotKey].angle = (deg + 360) % 360;
        renderThreePointWheel(true);
      };

      document.querySelectorAll("[data-select-slot]").forEach((btn) => {
        btn.addEventListener("click", () => {
          selectedWheelSlot = btn.getAttribute("data-select-slot");
          renderThreePointWheel(false);
        });
      });

      stage.querySelectorAll("[data-color-slot]").forEach((dot) => {
        dot.addEventListener("pointerdown", (e) => {
          e.stopPropagation();
          draggingSlot = dot.getAttribute("data-color-slot");
          selectedWheelSlot = draggingSlot;
          dot.setPointerCapture(e.pointerId);
        });

        dot.addEventListener("pointermove", (e) => {
          if (draggingSlot !== dot.getAttribute("data-color-slot")) return;
          updateAngleFromPointer(e.clientX, e.clientY, draggingSlot);
        });

        dot.addEventListener("pointerup", () => {
          draggingSlot = null;
        });
      });

      document.getElementById("btn-reset-wheel")?.addEventListener("click", () => {
        applyDesignPackage(localStorage.getItem(THEME_STORAGE_KEY) || "creamy");
        renderThreePointWheel(false);
      });

      renderThreePointWheel(false);
    }

    /* Scribbles */
    function initScribbles() {
      const canvas = document.getElementById("scribble-canvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");

      const savedDataUrl = localStorage.getItem(SCRIBBLE_STORAGE_KEY);
      if (savedDataUrl) {
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0);
        img.src = savedDataUrl;
      }

      let mode = "pen";
      let drawing = false;
      let lastX = 0;
      let lastY = 0;

      const penBtn = document.getElementById("btn-scribble-pen");
      const eraserBtn = document.getElementById("btn-scribble-eraser");

      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) * (canvas.width / rect.width),
          y: (e.clientY - rect.top) * (canvas.height / rect.height)
        };
      };

      canvas.addEventListener("pointerdown", (e) => {
        drawing = true;
        const pos = getPos(e);
        lastX = pos.x;
        lastY = pos.y;
        canvas.setPointerCapture(e.pointerId);
      });

      canvas.addEventListener("pointermove", (e) => {
        if (!drawing) return;
        const pos = getPos(e);

        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        if (mode === "eraser") {
          ctx.globalCompositeOperation = "destination-out";
          ctx.lineWidth = 24;
        } else {
          ctx.globalCompositeOperation = "source-over";
          ctx.lineWidth = 3.5;
          ctx.strokeStyle = document.body.getAttribute("data-theme") === "oled" ? "#F2EFE9" : "#2E2924";
        }

        ctx.stroke();
        lastX = pos.x;
        lastY = pos.y;
      });

      const stopDrawing = () => {
        if (!drawing) return;
        drawing = false;
        ctx.globalCompositeOperation = "source-over";
        try {
          localStorage.setItem(SCRIBBLE_STORAGE_KEY, canvas.toDataURL("image/png"));
        } catch {}
      };

      canvas.addEventListener("pointerup", stopDrawing);
      canvas.addEventListener("pointercancel", stopDrawing);

      penBtn?.addEventListener("click", () => {
        mode = "pen";
        penBtn.classList.add("is-active");
        eraserBtn?.classList.remove("is-active");
      });

      eraserBtn?.addEventListener("click", () => {
        mode = "eraser";
        eraserBtn.classList.add("is-active");
        penBtn?.classList.remove("is-active");
      });

      document.getElementById("btn-scribble-clear")?.addEventListener("click", () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        localStorage.removeItem(SCRIBBLE_STORAGE_KEY);
      });

      document.getElementById("btn-open-scribbles")?.addEventListener("click", () => {
        document.getElementById("scribbles-panel")?.scrollIntoView({ behavior: "smooth", block: "start" });
      });

      document.getElementById("btn-open-themes")?.addEventListener("click", () => {
        document.getElementById("themes-panel")?.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    /* ==========================================================================
       SCHRITT 4: FESTES LAYOUT (KOMPAKT / DETAIL) & START
       ========================================================================== */
    function applyHomeLayout(mode) {
      const chosen = mode === "detail" ? "detail" : "compact";
      document.body.setAttribute("data-home-layout", chosen);
      localStorage.setItem(LAYOUT_STORAGE_KEY, chosen);

      document.querySelectorAll("[data-layout-choice]").forEach((btn) => {
        btn.classList.toggle("is-active", btn.getAttribute("data-layout-choice") === chosen);
      });
    }

    function initHomeLayout() {
      applyHomeLayout(localStorage.getItem(LAYOUT_STORAGE_KEY) || "compact");
      document.querySelectorAll("[data-layout-choice]").forEach((btn) => {
        btn.addEventListener("click", () => {
          applyHomeLayout(btn.getAttribute("data-layout-choice"));
        });
      });
    }

    function updateHomeClock() {
      const el = document.getElementById("home-live-clock");
      if (!el) return;
      el.textContent = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    }

    document.addEventListener("DOMContentLoaded", () => {
      initDesignPackages();
      initCleanNavigation();
      initWeekCalendar();
      initThreePointWheel();
      initScribbles();
      initHomeLayout();

      document.getElementById("btn-stamp-in")?.addEventListener("click", () => stampNow("in"));
      document.getElementById("btn-stamp-out")?.addEventListener("click", () => stampNow("out"));

      document.getElementById("btn-quick-pause")?.addEventListener("click", () => {
        const data = loadAppData();
        const day = ensureDay(data, dateKey());
        day.pauseMinutes = (day.pauseMinutes || 0) + 15;
        saveAppData(data);
        renderToday();
        renderWeekCalendar();
      });

      document.getElementById("btn-quick-undo")?.addEventListener("click", () => {
        const data = loadAppData();
        const day = ensureDay(data, dateKey());
        day.stamps.pop();
        saveAppData(data);
        renderToday();
        renderWeekCalendar();
      });

      renderToday();
      updateHomeClock();
      setInterval(() => {
        updateHomeClock();
        renderToday();
      }, 15000);

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }
    });
  </script>
</body>
